services:
  frontend:
    build:
      context: ./frontend
      target: development
    networks:
      - internals
    ports:
      - 5173:5173
      # 80:5173 if you want to access the frontend on port 80
      # 443:5173 if you want to access the frontend on port 443
    volumes:
      - ./frontend/src:/app/src
  backend:
    build:
      context: ./backend
    networks:
      - internals
    ports:
      - 8000:8000
      # for now so you guys can test it using postman, later should be closed
    

networks:
  internals:
    driver: bridge