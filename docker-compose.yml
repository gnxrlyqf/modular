services:
  frontend:
    build:
      context: ./frontend
      target: development
    networks:
      - internals
    ports:
      - 5173:5173
      # 80:5173 if you want to access the frontend on port 80
      # 443:5173 if you want to access the frontend on port 443
    volumes:
      - ./frontend/src:/app/src
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:5173', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
      

  backend:
    build:
      context: ./backend
    networks:
      - internals
    ports:
      # TODO : backend should not be exposed to the outside world
      - 3001:8000
      # for now so you guys can test it using postman, later should be closed
    volumes:
      - ./logstash_ingest_data:/app/log_output
      - backend-db:/app/data
    environment:
      - LOG_FILE_PATH=/app/log_output/app.log
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/monitoring/metrics')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

