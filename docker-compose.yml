configs:
  filebeat-config:
    file: ./config/filebeat/filebeat.yml
  metricbeat-config:
    file: ./config/metricsbeat/metricsbeat.yml

networks:
  internals:
    driver: bridge

volumes:
  database-data:
    driver: local
  metabase-data:
    driver: local
  metabase-config:
    driver: local
  grafana-storage:
  certs:
    driver: local
  esdata01:
    driver: local
  kibanadata:
    driver: local
  metricbeatdata01:
    driver: local
  filebeatdata01:
    driver: local
  logstashdata01:
    driver: local