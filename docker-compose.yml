services:
  frontend:
    build:
      context: ./frontend
      target: development
    networks:
      - internals
    # ports:
      # - 5173:5173
      # 80:5173 if you want to access the frontend on port 80
      # 443:5173 if you want to access the frontend on port 
    environment:
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - VITE_FORTYTWO_CLIENT_ID=${VITE_FORTYTWO_CLIENT_ID}
      - VITE_SYNTHESIZER_URL=${VITE_SYNTHESIZER_URL:-https://localhost:8443/synthesizer}
      - VITE_METABASE_URL=${MB_PUBLIC_URL:-http://metabase:3000}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:5173', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s


  synthesizer:
    build:
      context: ./synthesizer
      target: development
    networks:
      - internals
    # ports:
    #   - 5174:5173
    volumes:
      - ./synthesizer/src:/app/src
      - ./synthesizer/public:/app/public
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:5174', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
      

  backend:
    build:
      context: ./backend
    networks:
      - internals
    # ports:
    #   # TODO : backend should not be exposed to the outside world
    #   - 3001:8000
      # for now so you guys can test it using postman, later should be closed
    volumes:
      - ./logstash_ingest_data:/app/log_output
      - metabase-config:/shared:ro
    environment:
      - LOG_FILE_PATH=/app/log_output/app.log
      - POSTGRES_DB=${POSTGRES_DB:-trandandan}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - FORTYTWO_CLIENT_ID=${VITE_FORTYTWO_CLIENT_ID}
      - FORTYTWO_CLIENT_SECRET=${FORTYTWO_CLIENT_SECRET}
      - FORTYTWO_REDIRECT_URI=${FORTYTWO_REDIRECT_URI:-http://localhost:8443/auth-callback.html}
      - ADMIN_USERNAMES=${ADMIN_USERNAMES:-}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-False}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_TIMEOUT=${EMAIL_TIMEOUT:-10}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - MB_PUBLIC_URL=${MB_PUBLIC_URL:-http://localhost:3004}
      - MB_EMBEDDING_SECRET_KEY=${MB_EMBEDDING_SECRET_KEY:-dev-embedding-secret-change-me-in-prod-32chars}
      - MB_CONFIG_PATH=/shared/metabase.json
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/monitoring/metrics')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  database:
    image: postgres:17-alpine3.22
    networks:
      - internals
    volumes:
      - database-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-trandandan}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: modular-main-nginx-1
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/certs:/etc/ssl/certs:ro
      - ./config/nginx/private:/etc/ssl/private:ro
    networks:
      - internals
    depends_on:
      - backend
      - frontend

  metabase:
    image: metabase/metabase:v0.58.14
    networks:
      - internals
    ports:
      - 3004:3000
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - MB_EMBEDDING_SECRET_KEY=${MB_EMBEDDING_SECRET_KEY:-dev-embedding-secret-change-me-in-prod-32chars}
      - MB_ENABLE_EMBEDDING=true
      - MB_SITE_URL=${MB_PUBLIC_URL:-http://localhost:3004}
    volumes:
      - metabase-data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  metabase-init:
    build:
      context: ./config/metabase
    networks:
      - internals
    environment:
      - MB_URL=http://metabase:3000
      - MB_ADMIN_EMAIL=${MB_ADMIN_EMAIL:-admin@trandandan.local}
      - MB_ADMIN_PASS=${MB_ADMIN_PASS:-Trand4ndan!Admin}
      - MB_EMBEDDING_SECRET_KEY=${MB_EMBEDDING_SECRET_KEY:-dev-embedding-secret-change-me-in-prod-32chars}
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-trandandan}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SHARED_CONFIG_PATH=/shared/metabase.json
    volumes:
      - metabase-config:/shared
    depends_on:
      metabase:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: "no"

