services:
  frontend:
    build:
      context: ./frontend
      target: development
    networks:
      - internals
    ports:
      - 5173:5173
      # 80:5173 if you want to access the frontend on port 80
      # 443:5173 if you want to access the frontend on port 443
    volumes:
      - ./frontend/src:/app/src
  backend:
    build:
      context: ./backend
    networks:
      - internals
    ports:
      - 3001:8000
      # for now so you guys can test it using postman, later should be closed

  prometheus:
    image: prom/prometheus
    networks:
      - internals
    ports:
      - 3002:9090
    volumes:
      - ./config/prometheus/prometheus-config.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    networks:
      - internals
    ports:
      - 3003:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/prometheus-dashboard.json

    volumes:
      - ./config/grafana/prometheus-dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/prometheus-dashboard-provider.yaml
      - ./config/grafana/prometheus-data-source.yaml:/etc/grafana/provisioning/datasources/prometheus-data-source.yaml
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards

networks:
  internals:
    driver: bridge
volumes:
  grafana-storage: