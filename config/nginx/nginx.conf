server {
    listen 443 ssl;
    server_name localhost;

    # Docker's internal DNS
    resolver 127.0.0.11 valid=30s;

    client_max_body_size 200M;
    absolute_redirect off;
    
    # Ensure these files are mounted in your Nginx container
    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Backend API (modular-main-backend-1)
    location /api/ {
        # Using the exact name from your 'docker ps'
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. WebSocket/Notifications (handled by backend)
    location /ws/ {
        set $notify_upstream http://backend:8000;
        proxy_pass $notify_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # 3. Synthesizer (modular-main-synthesizer-1)
    location /synthesizer/ {
        set $synth_upstream http://synthesizer:5173;
        proxy_pass $synth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Nginx Status (For monitoring)
    location /nginx_status {
        stub_status on;
        allow 172.16.0.0/12; # Common Docker network range
        deny all;
    }

    # 6. Frontend (modular-main-frontend-1)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP to HTTPS Redirect
server {
    listen 80;
    server_name localhost;

    location /nginx_status {
        stub_status on;
        allow 172.16.0.0/12;
        deny all;
    }

    location / {
        # Redirects to port 443
        return 301 https://$host:8443$request_uri;
    }
}